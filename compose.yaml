services:
  oracle:
    extends:
      file: deps.yaml
      service: oracle

  keycloak:
    extends:
      file: deps.yaml
      service: keycloak

  puppet:
    extends:
      file: deps.yaml
      service: puppet

  mailhog:
    extends:
      file: deps.yaml
      service: mailhog

  srm:
    hostname: srm
    ports:
      - "127.0.0.1:${SRM_HTTPS_PORT:-8443}:8443"
      - "127.0.0.1:${SRM_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${SRM_MANAGEMENT_PORT:-9990}:9990"
    environment:
      # The browser reaches Keycloak and the app on the host's ports
      KEYCLOAK_FRONTEND_SERVER_URL: 'http://localhost:${SRM_KEYCLOAK_PORT:-8081}/auth'
      FRONTEND_SERVER_URL: 'https://localhost:${SRM_HTTPS_PORT:-8443}'
